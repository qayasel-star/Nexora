

      - name: Comprobar que el ZIP es válido
        run: |
          ZIP="Nexora-2.0-Beta07-Repositorio-Limpio.zip"

          ls -lh "$ZIP"
          file "$ZIP"

          if ! unzip -t "$ZIP"; then
            echo "::error::El archivo no es un ZIP válido o está incompleto."
            echo "Vuelve a subir el ZIP original descargado de ChatGPT."
            exit 1
          fi

name: Descomprimir y compilar Nexora

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto Nexora
        run: |
          ZIP="Nexora-2.0-Beta07-Repositorio-Limpio.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP en la raíz."
            ls -la
            exit 1
          fi

          mkdir -p /tmp/nexora
          unzip -o "$ZIP" -d /tmp/nexora

          PROJECT_DIR="$(find /tmp/nexora -name settings.gradle.kts -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró settings.gradle.kts dentro del ZIP."
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .
          rm -f "$ZIP"

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Guardar proyecto descomprimido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Descomprimir proyecto Nexora Beta 07"
            git push
          fi

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK-v2.0-beta07
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
