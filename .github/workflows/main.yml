name: Descomprimir y compilar Nexora

on:
  workflow_dispatch:
  push:
    paths:
      - 'Nexora-2.0-Beta07-Repositorio-Limpio1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Descomprimir proyecto Nexora
        run: |
          ZIP="Nexora-2.0-Beta07-Repositorio-Limpio.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/nexora
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d /tmp/nexora

          SETTINGS="$(find /tmp/nexora -name settings.gradle.kts -type f -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle.kts"
            find /tmp/nexora -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          cp -a "$PROJECT_DIR"/. .

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Comprobar proyecto
        run: |
          echo "Archivos del proyecto:"
          find app/src/main -maxdepth 5 -type f | head -100

      - name: Publicar archivos del proyecto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/main.yml || true

          if ! git diff --cached --quiet; then
            git commit -m "Descomprimir proyecto Nexora Beta 07"
            git push origin HEAD:main
          fi

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
