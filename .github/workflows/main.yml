name: Descomprimir y compilar Nexora

on:
  workflow_dispatch:
  push:
    paths:
      - 'Nexora-2.0-Beta07-Repositorio-Limpio-1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Verificar y descomprimir ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Nexora-2.0-Beta07-Repositorio-Limpio-1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra el ZIP."
            echo "Archivos disponibles:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          unzip -t "$ZIP"

          mkdir -p /tmp/nexora
          unzip -oq "$ZIP" -d /tmp/nexora

          SETTINGS="$(find /tmp/nexora -name settings.gradle.kts -type f -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle.kts."
            echo "Contenido encontrado:"
            find /tmp/nexora -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Proyecto encontrado en: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Estructura Android verificada."

      - name: Revisar cambios
        run: |
          echo "Configuración Gradle:"
          cat settings.gradle.kts
          echo "Archivos principales:"
          find app/src/main -maxdepth 5 -type f | head -100

      - name: Publicar archivos del proyecto
        continue-on-error: true
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/main.yml || true

          if ! git diff --cached --quiet; then
            git commit -m "Descomprimir proyecto Nexora Beta 07"
            git push origin HEAD:main
          else
            echo "No hay cambios nuevos que publicar."
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Verificar APK generado
        run: |
          set -e
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó el APK."
            exit 1
          fi
          ls -lh "$APK"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
