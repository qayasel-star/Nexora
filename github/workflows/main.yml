name: Compilar APK Android Nexora

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar APK Nexora
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar estructura Android
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Estructura Android correcta."

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Verificar APK
        run: |
          set -e
          find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
